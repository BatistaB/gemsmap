name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [COBRAGUI, Map Builder, Backend (COBRApy), COBRAGUI ⇄ Map bridge, Import / export, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Import iML1515.xml\n2. Run pFBA\n3. …"
  - type: textarea
    id: env
    attributes:
      label: Diagnostics
      description: Click "GEMs MAP <version>" in the COBRAGUI status bar, then "Copy diagnostics", and paste it here (or the output of `gemsmap diagnose`). Add the model's format and size; its name only if it is not private.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Activity log / error details
      description: Status bar → Activity log, or "Show details" on the error card.
      render: text

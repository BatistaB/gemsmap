name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # genome-scale template tests use models generated from COBRApy's package data (nothing is downloaded)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cobra
      - run: python tools/templates/make_fixtures.py
      - run: npm test
      - run: npm run build

  backend:
    # the oldest supported Python (pyproject: >=3.10) and the current one
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: backend
          COBRAGUI_CACHE: ${{ runner.temp }}/cobragui-cache

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-185 -60 370 370" width="370" height="370">
  <!-- GEMs MAP mark: a gem cut from a metabolic network. Nodes = metabolites; edges = reactions on the diverging flux scale (red / blue, paler = smaller |flux|); girdle in ink. Generated by tools/brand/make_brand.py. Favicon weights (16–32 px); dark palette on dark backgrounds. -->
  <title>GEMs MAP</title>
  <style>.AE{stroke:#f3cada}.CF{stroke:#ffbbbc}.FH{stroke:#ffbbbc}.BF{stroke:#9e9bfe}.AB{stroke:#7e7fff}.EH{stroke:#736eeb}.AD{stroke:#4c49f6}.GH{stroke:#4c49f6}.BC{stroke:#1800ad}.BE{stroke:#ff5757}.CG{stroke:#ff3131}.DH{stroke:#f24e50}.g{stroke:#000000}.n{fill:#262626;stroke:#000000}
    @media (prefers-color-scheme:dark){.AE{stroke:#6b3a4a}.CF{stroke:#6e3a3c}.FH{stroke:#6e3a3c}.BF{stroke:#3a3880}.AB{stroke:#4a48a0}.EH{stroke:#5b59b8}.AD{stroke:#7471ff}.GH{stroke:#7471ff}.BC{stroke:#8f8cff}.BE{stroke:#ff6b6b}.CG{stroke:#ff4d55}.DH{stroke:#f2606a}.g{stroke:#ededed}.n{fill:#dcdcdc;stroke:#ffffff}}</style>
  <g stroke-linecap="round">
    <line class="AE" x1="-90" y1="0" x2="-75" y2="77" stroke-width="17"/>
    <line class="CF" x1="90" y1="0" x2="75" y2="77" stroke-width="17"/>
    <line class="FH" x1="75" y1="77" x2="0" y2="250" stroke-width="17"/>
    <line class="BF" x1="0" y1="0" x2="75" y2="77" stroke-width="17"/>
    <line class="AB" x1="-90" y1="0" x2="0" y2="0" stroke-width="17"/>
    <line class="EH" x1="-75" y1="77" x2="0" y2="250" stroke-width="17"/>
    <line class="AD" x1="-90" y1="0" x2="-157" y2="77" stroke-width="17"/>
    <line class="GH" x1="157" y1="77" x2="0" y2="250" stroke-width="17"/>
    <line class="BC" x1="0" y1="0" x2="90" y2="0" stroke-width="17"/>
    <line class="BE" x1="0" y1="0" x2="-75" y2="77" stroke-width="17"/>
    <line class="CG" x1="90" y1="0" x2="157" y2="77" stroke-width="17"/>
    <line class="DH" x1="-157" y1="77" x2="0" y2="250" stroke-width="17"/>
    <line class="g" x1="-157" y1="77" x2="-75" y2="77" stroke-width="8"/>
    <line class="g" x1="-75" y1="77" x2="75" y2="77" stroke-width="8"/>
    <line class="g" x1="75" y1="77" x2="157" y2="77" stroke-width="8"/>
  </g>
  <g class="n" stroke-width="5.5">
    <circle cx="-90" cy="0" r="25.25"/>
    <circle cx="0" cy="0" r="25.25"/>
    <circle cx="90" cy="0" r="25.25"/>
    <circle cx="-157" cy="77" r="25.25"/>
    <circle cx="-75" cy="77" r="25.25"/>
    <circle cx="75" cy="77" r="25.25"/>
    <circle cx="157" cy="77" r="25.25"/>
    <circle cx="0" cy="250" r="25.25"/>
  </g>
</svg>

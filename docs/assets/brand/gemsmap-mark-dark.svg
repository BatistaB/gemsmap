<svg xmlns="http://www.w3.org/2000/svg" viewBox="-181 -24 362 298" width="362" height="298">
  <!-- GEMsMAP mark: a gem cut from a metabolic network. Nodes = metabolites; edges = reactions on the diverging flux scale (red / blue, paler = smaller |flux|); girdle in ink. Generated by tools/brand/make_brand.py. Documentation header on dark backgrounds (UI weights). -->
  <title>GEMsMAP</title>
  <style>.AE{stroke:#6b3a4a}.CF{stroke:#6e3a3c}.FH{stroke:#6e3a3c}.BF{stroke:#3a3880}.AB{stroke:#4a48a0}.EH{stroke:#5b59b8}.AD{stroke:#7471ff}.GH{stroke:#7471ff}.BC{stroke:#8f8cff}.BE{stroke:#ff6b6b}.CG{stroke:#ff4d55}.DH{stroke:#f2606a}.g{stroke:#ededed}.n{fill:#dcdcdc;stroke:#ffffff}</style>
  <g stroke-linecap="round">
    <line class="AE" x1="-90" y1="0" x2="-75" y2="77" stroke-width="13"/>
    <line class="CF" x1="90" y1="0" x2="75" y2="77" stroke-width="13"/>
    <line class="FH" x1="75" y1="77" x2="0" y2="250" stroke-width="13"/>
    <line class="BF" x1="0" y1="0" x2="75" y2="77" stroke-width="13"/>
    <line class="AB" x1="-90" y1="0" x2="0" y2="0" stroke-width="13"/>
    <line class="EH" x1="-75" y1="77" x2="0" y2="250" stroke-width="13"/>
    <line class="AD" x1="-90" y1="0" x2="-157" y2="77" stroke-width="13"/>
    <line class="GH" x1="157" y1="77" x2="0" y2="250" stroke-width="13"/>
    <line class="BC" x1="0" y1="0" x2="90" y2="0" stroke-width="13"/>
    <line class="BE" x1="0" y1="0" x2="-75" y2="77" stroke-width="13"/>
    <line class="CG" x1="90" y1="0" x2="157" y2="77" stroke-width="13"/>
    <line class="DH" x1="-157" y1="77" x2="0" y2="250" stroke-width="13"/>
    <line class="g" x1="-157" y1="77" x2="-75" y2="77" stroke-width="6"/>
    <line class="g" x1="-75" y1="77" x2="75" y2="77" stroke-width="6"/>
    <line class="g" x1="75" y1="77" x2="157" y2="77" stroke-width="6"/>
  </g>
  <g class="n" stroke-width="5">

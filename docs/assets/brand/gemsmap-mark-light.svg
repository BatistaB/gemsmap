  <style>.AE{stroke:#f3cada}.CF{stroke:#ffbbbc}.FH{stroke:#ffbbbc}.BF{stroke:#9e9bfe}.AB{stroke:#7e7fff}.EH{stroke:#736eeb}.AD{stroke:#4c49f6}.GH{stroke:#4c49f6}.BC{stroke:#1800ad}.BE{stroke:#ff5757}.CG{stroke:#ff3131}.DH{stroke:#f24e50}.g{stroke:#000000}.n{fill:#262626;stroke:#000000}</style>
  <g stroke-linecap="round">
